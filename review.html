<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding design review</title><style>body{margin:0;background:#bbb9b3;font:14px Arial}nav{display:flex;gap:12px;padding:12px;background:#fff;position:sticky;top:0;z-index:1}button{padding:10px;cursor:pointer}iframe{display:block;margin:20px auto;border:0;box-shadow:0 5px 35px #0003;background:#f6f2e9;width:390px;height:844px}label{display:flex;align-items:center;gap:6px}</style></head><body><nav><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1024">1024 px</button><button data-width="1440">1440 px</button><button id="home">Top</button><button data-anchor="story">Welcome</button><button data-anchor="details">Venue</button><button data-anchor="attire">Attire</button><button data-anchor="travel">Travel</button><button data-anchor="gallery">Gallery</button><button data-anchor="registry">Registry</button><button data-anchor="rsvp">RSVP</button><button data-anchor="questions">FAQ</button></nav><iframe title="Wedding responsive preview" src="preview.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.querySelector('#home').onclick=()=>frame.contentWindow.scrollTo(0,0);document.querySelectorAll('[data-anchor]').forEach(b=>b.onclick=()=>frame.contentDocument.getElementById(b.dataset.anchor).scrollIntoView());</script></body></html>
